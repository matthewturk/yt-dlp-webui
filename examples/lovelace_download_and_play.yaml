# yt-dlp WebUI: Download Audio & Play on Media Player
#
# End-to-end example: type (or paste) a YouTube URL on your dashboard, pick a
# download location, tap the button, and the audio is downloaded into that
# location and then streamed to your media player.
#
# Adjust the helper options / media_player entity to your setup. The
# `input_select` options must match the `allowed_locations[].name` entries in
# the add-on's webui_config.json (or add-on configuration).
#
# 1. Helpers  (configuration.yaml)
input_text:
  yt_dlp_url:
    name: YouTube URL
    icon: mdi:link-variant

input_select:
  yt_dlp_location:
    name: Download Location
    icon: mdi:folder-music
    options:
      - Music
      - Downloads

# 2. Automation  (automations.yaml)
automation:
  - alias: yt-dlp Download & Play
    description: Download audio from the entered URL and stream it to the media player
    mode: single
    trigger: []
    action:
      - service: yt_dlp_webui.download_audio
        data:
          url: "{{ states('input_text.yt_dlp_url') }}"
          location: "{{ states('input_select.yt_dlp_location') }}"
          media_player: media_player.kitchen_speaker
      - service: input_text.set_value
        target:
          entity_id: input_text.yt_dlp_url
        data:
          value: ""

# 3. Lovelace card  (paste into a dashboard view, Raw configuration editor)
type: vertical-stack
cards:
  - type: entities
    title: yt-dlp Download & Play
    entities:
      - entity: input_text.yt_dlp_url
        name: YouTube URL
      - entity: input_select.yt_dlp_location
        name: Download to
      - entity: sensor.yt_dlp_last_completed_audio
        name: Last Downloaded
  - type: button
    name: Download & Play
    icon: mdi:music-box-multiple
    tap_action:
      action: call-service
      service: automation.trigger
      data:
        entity_id: automation.yt_dlp_download_and_play

